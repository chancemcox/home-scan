services:
  homescan:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      SCAN_MODE: nmap
      SCAN_NETWORK: ${SCAN_NETWORK:-192.168.1.0/24}
    volumes:
      - homescan-data:/data
      - homescan-tunnel:/run/homescan-tunnel
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [cloudflare]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token-file, /run/homescan-tunnel/token]
    volumes:
      - homescan-tunnel:/run/homescan-tunnel:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  homescan-data:
  homescan-tunnel:
