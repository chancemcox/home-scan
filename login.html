<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeScan · Sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-shell">
<form id="login-form" class="login-card" autocomplete="on">
<small class="eyebrow">HOME NETWORK</small>
<h1>HomeScan<span class="brand-dot">.</span></h1>
<p>Sign in to manage inventory, Cloudflare routes, and cluster status.</p>
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<label class="toggle remember"><input id="remember" type="checkbox"> Remember me on this device</label>
<p id="login-error" class="error" role="alert"></p>
<button class="primary" type="submit">Sign in</button>
</form>
</main>
<script src="/login.js"></script>
</body>
</html>
