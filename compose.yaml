services:
  homescan:
    build:
      context: .
      args:
        HOMESCAN_PUSH: ${HOMESCAN_PUSH:-unknown}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SCAN_MODE: agent
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN in .env}
      HA_ENABLED: ${HA_ENABLED:-1}
      HA_HOSTNAME: ${HA_HOSTNAME:-}
      HA_PORT: ${HA_PORT:-8080}
      HA_LOCAL_IP: ${HA_LOCAL_IP:?Set HA_LOCAL_IP to this host's LAN IP}
      CLUSTER_WORKER_URL: ${CLUSTER_WORKER_URL:-}
      CLUSTER_SECRET: ${CLUSTER_SECRET:-}
      HOMESCAN_ADMIN_PASSWORD: ${HOMESCAN_ADMIN_PASSWORD:-}
      HOMESCAN_PUSH: ${HOMESCAN_PUSH:-unknown}
    volumes:
      - homescan-data:/data
      - ./.secrets:/run/homescan-secrets:ro
      - homescan-tunnel:/run/homescan-tunnel
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [cloudflare]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token-file, /run/homescan-tunnel/token]
    volumes:
      - homescan-tunnel:/run/homescan-tunnel:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  homescan-data:
  homescan-tunnel:
